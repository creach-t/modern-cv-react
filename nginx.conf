server {
    listen 2585;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Redirections internes sans exposer le port 2585 (derrière Traefik)
    absolute_redirect off;

    # http -> https (Traefik transmet le schéma d'origine)
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    # /index.html -> / (et /x/index.html -> /x/). On teste $request_uri (URI d'origine) :
    # un `location = /index.html` bouclerait avec la directive `index` (redirection interne).
    if ($request_uri ~ "^(.*)/index\.html(\?.*)?$") {
        return 301 $1/;
    }

    # Vraie page 404 (statut HTTP 404, pas une 200 "page introuvable")
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # ── Compression ──────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/javascript
        image/svg+xml
        application/font-woff
        application/font-woff2;

    # ── Health check endpoint (used by Docker & deploy script) ──
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ── Static assets — cache 1 an (hash dans le nom du fichier) ──
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Pages statiques (/, /projets/...) : le site n'a pas de routes client,
    #    tout chemin inconnu renvoie un vrai 404 ──
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # ── Sécurité ─────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # Masquer la version Nginx
    server_tokens off;
}
