<!DOCTYPE html>
<html lang="fr">
  <head>
    <!-- Character Encoding -->
    <meta charset="utf-8" />
    
    <!-- Viewport for Responsive Design -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover" />
    
    <!-- Favicons and Touch Icons -->
    <link rel="icon" href="/img/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/img/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/img/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    
    <!-- Theme and Color -->
    <meta name="theme-color" content="#000000" />
    <meta name="msapplication-TileColor" content="#000000" />
    
    <!-- Primary SEO Meta Tags -->
    <title>Théo Créac'h, développeur web full-stack React & Node.js</title>
    <meta name="description" content="Portfolio de Théo Créac'h, développeur web full-stack JavaScript à Saint-Maur-des-Fossés. Projets React et Node.js : DevJobs, ZombieLand, O'Coffee, VectoKid." />
    <meta name="author" content="Théo Créac'h" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://creachtheo.fr/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:site_name" content="Théo Créac'h" />
    <meta property="og:title" content="Théo Créac'h, développeur web full-stack React & Node.js" />
    <meta property="og:description" content="Portfolio de Théo Créac'h, développeur web full-stack JavaScript à Saint-Maur-des-Fossés. Projets React et Node.js : DevJobs, ZombieLand, O'Coffee, VectoKid." />
    <meta property="og:url" content="https://creachtheo.fr/" />
    <meta property="og:image" content="https://creachtheo.fr/img/social-preview.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Théo Créac'h, développeur web full-stack JavaScript" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Théo Créac'h, développeur web full-stack React & Node.js" />
    <meta name="twitter:description" content="Portfolio de Théo Créac'h, développeur web full-stack JavaScript à Saint-Maur-des-Fossés. Projets React et Node.js : DevJobs, ZombieLand, O'Coffee, VectoKid." />
    <meta name="twitter:image" content="https://creachtheo.fr/img/social-preview.jpg" />
    <meta name="twitter:image:alt" content="Théo Créac'h, développeur web full-stack JavaScript" />

    <!-- Structured Data : Person + WebSite (la liste des projets est injectée au build par scripts/seo-build.mjs) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Person",
          "@id": "https://creachtheo.fr/#person",
          "name": "Théo Créac'h",
          "givenName": "Théo",
          "familyName": "Créac'h",
          "jobTitle": "Développeur web full-stack JavaScript",
          "description": "Développeur web full-stack JavaScript (React, Node.js) basé à Saint-Maur-des-Fossés.",
          "url": "https://creachtheo.fr/",
          "image": "https://creachtheo.fr/img/profil_picture.png",
          "email": "mailto:creach.t@gmail.com",
          "address": {
            "@type": "PostalAddress",
            "addressLocality": "Saint-Maur-des-Fossés",
            "addressRegion": "Île-de-France",
            "addressCountry": "FR"
          },
          "sameAs": [
            "https://linkedin.com/in/creachtheo",
            "https://github.com/creach-t"
          ],
          "alumniOf": [
            { "@type": "EducationalOrganization", "name": "École O'Clock" },
            { "@type": "EducationalOrganization", "name": "Lycée Léonard de Vinci" }
          ],
          "knowsAbout": ["React", "Node.js", "Express.js", "JavaScript", "TypeScript", "PostgreSQL", "Tailwind CSS", "Docker", "CI/CD"]
        },
        {
          "@type": "WebSite",
          "@id": "https://creachtheo.fr/#website",
          "url": "https://creachtheo.fr/",
          "name": "Théo Créac'h",
          "inLanguage": "fr",
          "publisher": { "@id": "https://creachtheo.fr/#person" }
        }
      ]
    }
    </script>

    <!-- Web App Capabilities -->
    <meta name="application-name" content="Théo Créac'h Portfolio" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
  </head>
  <body>
    <noscript>Ce CV interactif n'est visible qu'avec Javascript d'activé</noscript>
    <div id="root"></div>
  </body>
</html>
