name: 🚀 CI/CD Pipeline

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ──────────────────────────────────────────────
  # Job 1 : Tests & vérification du build
  # ──────────────────────────────────────────────
  test:
    name: 🧪 Tests & Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
      - run: npm ci
      - run: npm test -- --watchAll=false --passWithNoTests --ci
      - run: npm run build

  # ──────────────────────────────────────────────
  # Job 2 : Build image Docker + Push vers GHCR
  # ──────────────────────────────────────────────
  build-image:
    name: 🐳 Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: 🔑 Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: 🐳 Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          no-cache: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            REACT_APP_LLM_API_KEY=${{ secrets.LLM_API_KEY }}
            REACT_APP_LLM_API_URL=${{ vars.LLM_API_URL }}
            REACT_APP_LLM_MODEL=${{ vars.LLM_MODEL }}

  # ──────────────────────────────────────────────
  # Job 3 : Deploy sur VPS (zero-downtime)
  # ──────────────────────────────────────────────
  deploy:
    name: 🌐 Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-image
    environment:
      name: production
      url: https://creachtheo.fr
    steps:
      - uses: actions/checkout@v4

      - name: 🏷️ Set image tag
        id: set-tag
        run: echo "IMAGE_TAG=sha-$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: 📤 Copy docker-compose.prod.yml to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: docker-compose.prod.yml
          target: /root/projects/modern-cv-react

      - name: 🚀 Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG: ${{ steps.set-tag.outputs.IMAGE_TAG }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: IMAGE_TAG
          script: |
            set -e
            cd /root/projects/modern-cv-react
            echo ${{ secrets.GHCR_PAT }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin || echo "⚠️ GHCR login ignoré (image publique)"
            echo "📦 Deploying image tag: $IMAGE_TAG"
            export IMAGE_TAG
            docker compose -f docker-compose.prod.yml pull
            # supprime un éventuel conteneur homonyme non géré par compose (conflit de nom)
            docker rm -f modern-cv-react 2>/dev/null || true
            docker compose -f docker-compose.prod.yml up -d --force-recreate --remove-orphans
            docker image prune -f
            echo "✅ Deployed!"
