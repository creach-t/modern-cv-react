name: Refresh project screenshots

# Garde les captures des projets à jour avec les sites déployés.
on:
  schedule:
    - cron: "0 4 * * 1" # tous les lundis à 04:00 UTC
  workflow_dispatch: {} # lançable à la main depuis l'onglet Actions

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Utiliser un PAT (SCREENSHOTS_PAT) si présent : un push signé par
          # GITHUB_TOKEN ne redéclenche PAS le workflow de déploiement.
          token: ${{ secrets.SCREENSHOTS_PAT || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - run: npm ci
      - run: npm i puppeteer --no-save

      - name: Capture screenshots
        run: npm run shots

      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain public/img/projects)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/img/projects
            git commit -m "chore: refresh project screenshots"
            git push
            echo "Screenshots mises à jour."
          else
            echo "Aucun changement."
          fi
